<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>log in</title>
  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <div class="continer">
    <header>Login</header>
    <main>
      <div class="username">

        <label for="user">Username :</label><br>
        <input type="email" id="user" placeholder="Type  your username">

      </div>

      <div class="password"> 
        <label for="pass"> password :</label><br>
        <input type="password" id="pass" placeholder="Type  your password">
      </div>
      <p class="forgotpass">Forgot password?</p>
      <div class="section">
        <button class="login">LOGIN</button>
        <p class="offer">or sign up Using</p>
      </div>
      <div class="image">
        <img src="photo/icons8-facebook-logo-48 (1).png " alt="facebook">
        <img src="photo/icons8-twitter-circled-48.png" alt="twitter">
        <img src="photo/icons8-google-plus-50.png" alt="google-plus">
      </div>
    </main>


  </div>

</body>

</html>
